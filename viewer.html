<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GLB Projection Viewer</title>
  <style>
    :root { font: 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #e3e9ed; background: #10171d; color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 600px; height: 100dvh; display: flex; flex-direction: column; }
    header { display: flex; gap: 12px; align-items: center; padding: 14px 20px; background: #151f27; border-bottom: 1px solid #35434e; }
    h1 { font-size: 16px; margin: 0 8px 0 0; white-space: nowrap; }
    button, select { font: inherit; color: inherit; background: #18242d; border: 1px solid #35434e; border-radius: 5px; padding: 7px 10px; }
    button { cursor: pointer; }
    button:disabled, select:disabled { opacity: .45; cursor: default; }
    button:focus-visible, select:focus-visible { outline: 2px solid #91d8c4; outline-offset: 3px; }
    #viewer-filename { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #adbdc7; }
    nav { display: flex; gap: 10px; align-items: center; padding: 12px 20px; }
    #viewer-area { min-height: 0; flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    #viewer-stage { background: #17212a; }
    canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    #viewer-status { padding: 10px 20px; margin: 0; color: #adbdc7; }
    #viewer-status:empty { display: none; }
    #viewer-status.error { color: #ffb4a8; }
  </style>
</head>
<body>
  <header><h1>GLB Viewer</h1><button id="viewer-open" type="button" disabled>GLBを開く</button><span id="viewer-filename"></span></header>
  <input id="viewer-file" type="file" accept=".glb,model/gltf-binary" aria-label="表示するGLB" hidden>
  <nav aria-label="表示設定">
    <select id="viewer-view" aria-label="カメラ" disabled><option value="reference">基準カメラ</option><option value="orbit">配置確認</option></select>
    <button id="viewer-reset" type="button" disabled>カメラを戻す</button>
  </nav>
  <main id="viewer-area"><div id="viewer-stage"><canvas id="viewer-canvas" aria-label="GLB表示"></canvas></div></main>
  <p id="viewer-status" role="status" aria-live="polite">GLBを選択してください。</p>
  <script type="module" src="/src/viewer.ts"></script>
</body>
</html>
